name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ github.repository == 'Suman8055/musicplayer-staging' && '/musicplayer-staging' || '/musicplayer' }}


      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
          # F31: keep old files so the previous build's content-hashed immutable chunks
          # survive one deploy cycle. A client still running the old build (or the SW
          # mid-reload) can still fetch its chunks instead of hitting a 404. Hashed
          # filenames never collide, so stale chunks are harmless and get GC'd naturally.
          keep_files: true
